<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css"><link rel="stylesheet" href="screens.css">
<style>.screen{width:800px;height:480px}</style></head><body data-theme="dusk">

  <div class="focus on" style="top:100px;left:16px"><svg><use href="sprite.svg#restore"/></svg></div>

    <div class="h"><span class="play"><svg><use href="sprite.svg#play"/></svg></span><span class="step"><svg><use href="sprite.svg#prev"/></svg></span><span class="step"><svg><use href="sprite.svg#next"/></svg></span><span class="speed">2×</span><span class="info"><span class="ts">22:20<span class="now">Maintenant</span></span><span class="sub">13 + 3 trames</span></span><span class="src">RainViewer</span></div>
    <div class="wrap"><div class="track"><span class="past"></span><span class="future"></span><span class="nowm"><i>Maintenant</i></span><span class="thumb"></span></div></div>
    <div class="ticks"><span>−2 h</span><span>+30 min</span></div>
  </div>
  <span class="attrib">© Mapbox © OpenStreetMap · RainViewer</span>
</div>
</body></html>
