name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  server:
    name: server tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm test

  client:
    name: client build (lint + webpack)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run prod
      # Structural reproducibility of the committed client/dist (the artifact
      # every Pi serves on `git pull`). A fresh build (with webpack
      # `output.clean`) must produce the same SET of files as committed: a
      # DELETED file means the commit carried a stale orphan chunk the build no
      # longer emits; a NEW/untracked file means a chunk-layout change wasn't
      # committed. Either is real drift and fails CI.
      #
      # We deliberately do NOT byte-compare minified JS content (the ` M`
      # modified status is ignored). The committed bundle is built on the
      # maintainer's macOS box, and webpack/terser minification is not
      # byte-identical to a Linux CI build (terser mangles a few identifiers
      # differently — confirmed: first divergence at a mangled name in the
      # axios region, ~byte 997k, no env value embedded). So content drift
      # across the macOS-build / ubuntu-CI boundary is expected; only the file
      # set is environment-independent and worth gating on. Closing the
      # content-tamper gap fully would mean building dist in CI rather than
      # committing a hand-built one — a separate workflow decision.
      - name: Verify committed dist file set is reproducible
        run: |
          STRUCT="$(git status --porcelain -- dist | grep -vE '^ M ' || true)"
          if [ -n "$STRUCT" ]; then
            echo "::error::client/dist file set is out of sync with src (orphan or uncommitted chunk). Run 'cd client && npm run prod' and commit the regenerated dist/."
            echo "$STRUCT"
            exit 1
          fi
          echo "client/dist file set is reproducible from src ✓"
