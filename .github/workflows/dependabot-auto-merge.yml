# Auto-merge Dependabot PRs that fix a published security advisory
# (GHSA / CVE), provided the bump is patch or minor and the required
# CI checks have passed.
#
# Rationale (2026-05-24): Dependabot already opens security PRs and
# the CI workflow ("server tests" + "client build (lint + webpack)")
# runs against each one. The maintainer just wasn't seeing them in
# time — the qs CVE-2026-8723 patch sat open as PR #157 for 24 h
# until a direct manual push superseded it. This workflow lets
# security patches flow to master automatically when:
#   - the PR was opened by `dependabot[bot]`, AND
#   - the PR is a security update (either signal below), AND
#   - the bump is `version-update:semver-patch` or
#     `version-update:semver-minor`, AND
#   - the required status checks pass (gated by branch protection
#     on `master` — `gh pr merge --auto` waits for them).
#
# Two signals identify a security update, and either one is enough:
#   1. `ghsa-id` from `dependabot/fetch-metadata` — populated only when
#      the bumped package is a DIRECT dependency (listed in a manifest).
#   2. Dependabot's own security-fix footer in the PR body ("You can
#      disable automated security fix PRs for this repo…") — the only
#      signal that survives on a TRANSITIVE dependency, where
#      fetch-metadata returns an empty `ghsa-id` AND an empty
#      `alert-state`.
#
# Why the second signal exists (2026-09-24): with the `ghsa-id` gate
# alone every transitive security PR fell through — PR #298 in July,
# then all six of September's (#344 fast-uri, #345 qs, #346
# postcss-selector-parser, #347 @humanfs/node, #351 browserslist,
# #352 js-yaml) sat one to five days for a human, the exact failure
# this workflow was built to prevent. This project's exposure is
# almost entirely transitive (ajv / babel / eslint / postcss subtrees,
# qs via express), so the net covered the half that never fires. The
# footer was checked against the 40 most recent Dependabot PRs before
# being trusted: present on all 11 security PRs (direct and
# transitive), absent from all 29 plain version-update PRs — including
# the ones whose upstream release notes talk about security, which is
# why release-notes text is deliberately NOT used as a signal.
#
# Major-version security bumps still need manual review (breaking
# changes are common across major boundaries; a CVE fix that's only
# available in a major bump deserves a careful look). Non-security
# Dependabot PRs (weekly minor/patch maintenance bumps) also stay
# manual — keeps the maintainer in the loop for the regular cadence.

name: Dependabot auto-merge security PRs

on:
  pull_request:
    branches: [master]

permissions:
  # `contents: write` lets the auto-merge actually land the squash
  # commit on `master`; `pull-requests: write` lets `gh pr merge`
  # toggle the auto-merge flag on the PR. Both are required for the
  # Dependabot auto-merge pattern documented at
  # https://docs.github.com/en/code-security/dependabot/working-with-dependabot/automating-dependabot-with-github-actions
  contents: write
  pull-requests: write

jobs:
  dependabot-auto-merge:
    # Only run on PRs authored by Dependabot. Other PRs are unaffected.
    if: ${{ github.actor == 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge for security patch/minor bumps
        # Gated on:
        #   - a security signal: `ghsa-id` non-empty (direct dependency)
        #     OR Dependabot's security-fix footer in the PR body
        #     (transitive dependency). The body is tested with
        #     `contains()` inside the expression and never interpolated
        #     into a shell, so the upstream release notes Dependabot
        #     quotes in it cannot inject anything.
        #   - update-type ∈ {semver-patch, semver-minor} → major bumps
        #     still need human eyes for breaking-change review.
        if: |
          (steps.metadata.outputs.ghsa-id != '' ||
           contains(github.event.pull_request.body, 'automated security fix PRs')) &&
          (steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
           steps.metadata.outputs.update-type == 'version-update:semver-minor')
        run: |
          if [ -n "$GHSA_ID" ]; then
            reason="advisory $GHSA_ID (direct dependency)"
          else
            reason="Dependabot security-fix footer in the PR body (transitive dependency)"
          fi
          echo "Auto-merging security $UPDATE_TYPE for $DEPENDENCY_NAMES — $reason"
          gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHSA_ID: ${{ steps.metadata.outputs.ghsa-id }}
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
          DEPENDENCY_NAMES: ${{ steps.metadata.outputs.dependency-names }}
