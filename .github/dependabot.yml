version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    # Supply-chain cooldown (2026-06-10, prompted by the Miasma worm wave):
    # wait 7 days after a release before proposing it as a version bump.
    # Worm-published malicious versions are typically detected and yanked
    # within days, so the cooldown keeps the weekly bumps behind that hot
    # window. Dependabot SECURITY updates ignore cooldown entirely, so
    # advisory fixes (and the auto-merge workflow that lands patch/minor
    # ones) are unaffected.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "server"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    groups:
      server-dev-minor-patch:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
      server-prod-minor-patch:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directory: "/client"
    schedule:
      interval: "weekly"
      day: "monday"
    # 7-day supply-chain cooldown — rationale on the server npm entry above.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "client"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    groups:
      client-dev-minor-patch:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
      client-prod-minor-patch:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    # 7-day supply-chain cooldown — rationale on the server npm entry above.
    # (github-actions only supports default-days, not the semver-* variants.)
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "chore(ci)"
