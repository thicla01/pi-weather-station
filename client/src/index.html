<!DOCTYPE html>
<html lang="en">
  <head>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV/XN/WLs="
      crossorigin=""
    ></script>
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300&display=swap" rel="stylesheet">    
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#0d0d0c" />
    <!-- Apple home-screen icon for PWA installs. Reuses the same
         radar-themed favicon.svg that webpack already injects as
         `rel="icon"`; iOS 14+ accepts SVG for apple-touch-icon. -->
    <link rel="apple-touch-icon" href="favicon.svg" />
    <!-- PWA manifest — used by Chrome / Android to enable
         "Add to Home Screen" with proper standalone display,
         icon, theme colour. iOS Safari uses the apple-*-meta
         tags above instead. -->
    <link rel="manifest" href="manifest.json" />
    <title>Pi Weather Station</title>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
